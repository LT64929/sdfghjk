<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midnight Watch - Survival Horror</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #fff;
            overflow: hidden;
        }

        .game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #0a0a0a;
        }

        .header {
            background: #1a1a1a;
            border-bottom: 2px solid #ff4444;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title {
            font-size: 24px;
            font-weight: bold;
            color: #ff4444;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .time-display {
            font-size: 18px;
            color: #ffff00;
            background: #222;
            padding: 8px 16px;
            border: 1px solid #ffff00;
        }

        .main-content {
            flex: 1;
            display: flex;
            gap: 10px;
            padding: 10px;
        }

        .camera-view {
            flex: 2;
            background: #000;
            border: 3px solid #333;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .camera-header {
            background: #111;
            padding: 10px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .camera-location {
            color: #00ff00;
            font-weight: bold;
        }

        .camera-status {
            color: #ffff00;
            font-size: 12px;
        }

        .camera-feed {
            flex: 1;
            background: linear-gradient(45deg, #1a1a1a, #2a2a2a);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .camera-scene {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .scene-background {
            position: absolute;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
        }

        .lobby-bg {
            background: linear-gradient(180deg, #2a1a1a 0%, #1a1a2a 100%);
        }

        .lobby-bg::before {
            content: '';
            position: absolute;
            width: 80%;
            height: 70%;
            border: 2px solid #444;
            background: rgba(30, 30, 50, 0.5);
            top: 15%;
            left: 10%;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        .hallway-bg {
            background: linear-gradient(90deg, #1a0a1a 0%, #0a1a2a 50%, #1a0a1a 100%);
            background-size: 200% 100%;
            animation: hallway-flicker 0.3s infinite alternate;
        }

        @keyframes hallway-flicker {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 0%; }
        }

        .basement-bg {
            background: linear-gradient(180deg, #0a0a0a 0%, #1a0a0a 100%);
            background: repeating-linear-gradient(
                45deg,
                #0a0a0a,
                #0a0a0a 10px,
                #1a0a0a 10px,
                #1a0a0a 20px
            );
        }

        .exterior-bg {
            background: linear-gradient(180deg, #000a1a 0%, #0a0a00 50%, #1a0a00 100%);
        }

        .exterior-bg::before {
            content: '';
            position: absolute;
            width: 30%;
            height: 50%;
            background: radial-gradient(circle, rgba(255,100,0,0.3) 0%, transparent 70%);
            border-radius: 50%;
            bottom: 0;
            left: 10%;
            filter: blur(40px);
        }

        .camera-scan {
            width: 100%;
            height: 2px;
            background: rgba(255, 0, 0, 0.5);
            position: absolute;
            top: 0;
            z-index: 10;
            animation: scan 2s linear infinite;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .entity {
            width: 150px;
            height: 150px;
            background: rgba(255, 50, 50, 0.3);
            border: 2px solid #ff3232;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 80px;
            position: absolute;
            animation: flicker 0.1s infinite;
            z-index: 5;
            filter: drop-shadow(0 0 10px #ff3232);
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        @keyframes entity-move {
            0%, 100% { 
                left: 30%;
                top: 20%;
            }
            25% {
                left: 70%;
                top: 30%;
            }
            50% {
                left: 50%;
                top: 60%;
            }
            75% {
                left: 20%;
                top: 50%;
            }
        }

        .entity.moving {
            animation: flicker 0.1s infinite, entity-move 4s ease-in-out infinite;
        }

        .status-text {
            font-size: 20px;
            color: #666;
            text-align: center;
            z-index: 2;
            position: relative;
        }

        .camera-controls {
            background: #1a1a1a;
            padding: 10px;
            border-top: 1px solid #333;
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .camera-btn {
            flex: 1;
            min-width: 80px;
            padding: 8px;
            background: #333;
            border: 2px solid #555;
            color: #fff;
            cursor: pointer;
            text-transform: uppercase;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            transition: all 0.2s;
        }

        .camera-btn:hover {
            background: #444;
            border-color: #fff;
        }

        .camera-btn.active {
            background: #00ff00;
            border-color: #00ff00;
            color: #000;
            font-weight: bold;
        }

        .sidebar {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .panel {
            background: #1a1a1a;
            border: 2px solid #444;
            padding: 15px;
            flex: 1;
            overflow-y: auto;
        }

        .panel-title {
            color: #ffff00;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
            border-bottom: 1px solid #ffff00;
            padding-bottom: 5px;
        }

        .resource-bar {
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .resource-label {
            color: #ccc;
            font-size: 12px;
            min-width: 80px;
        }

        .bar {
            flex: 1;
            height: 20px;
            background: #333;
            border: 1px solid #555;
            margin: 0 10px;
            position: relative;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background: #00ff00;
            transition: width 0.3s, background-color 0.3s;
        }

        .bar-fill.warning {
            background: #ffff00;
        }

        .bar-fill.danger {
            background: #ff4444;
        }

        .resource-value {
            color: #00ff00;
            font-weight: bold;
            min-width: 30px;
            text-align: right;
        }

        .threat-list {
            list-style: none;
        }

        .threat-item {
            padding: 8px;
            margin: 5px 0;
            background: #222;
            border-left: 3px solid #ff4444;
            color: #ccc;
            font-size: 12px;
            animation: pulse-threat 1s infinite;
        }

        @keyframes pulse-threat {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            background: #333;
            border: 1px solid #666;
            color: #fff;
            cursor: pointer;
            text-transform: uppercase;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            transition: all 0.2s;
        }

        .btn:hover {
            background: #444;
            border-color: #fff;
        }

        .btn.active {
            background: #ff4444;
            border-color: #ff4444;
            color: #000;
        }

        .game-over {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .game-over.show {
            display: flex;
        }

        .game-over-text {
            font-size: 48px;
            color: #ff4444;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .game-over-message {
            font-size: 18px;
            color: #ccc;
            margin-bottom: 30px;
        }

        .restart-btn {
            padding: 15px 40px;
            font-size: 16px;
            background: #ff4444;
            border: none;
            color: #000;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
        }

        .restart-btn:hover {
            background: #ff6666;
        }

        .wave-counter {
            color: #ffff00;
            font-size: 14px;
            margin-top: 10px;
        }

        .camera-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: #ff3333;
            border-radius: 50%;
            animation: pulse-camera 1s infinite;
            margin-right: 5px;
        }

        @keyframes pulse-camera {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .creature-sound {
            position: absolute;
            font-size: 14px;
            color: #ff4444;
            animation: sound-rise 2s ease-out forwards;
            pointer-events: none;
            z-index: 3;
            font-weight: bold;
            text-shadow: 0 0 10px #ff4444;
        }

        @keyframes sound-rise {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(-80px) scale(0.5);
                opacity: 0;
            }
        }

        .glitch-effect {
            animation: glitch 0.3s infinite;
        }

        @keyframes glitch {
            0%, 100% {
                filter: brightness(1);
            }
            50% {
                filter: brightness(0.7);
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="title">MIDNIGHT WATCH</div>
            <div class="time-display">NIGHT <span id="wave">1</span> | TIME: <span id="timer">300</span>s</div>
        </div>

        <div class="main-content">
            <div class="camera-view">
                <div class="camera-header">
                    <span class="camera-location" id="camera-location">📹 CAMERA 1: LOBBY</span>
                    <span class="camera-status"><span class="camera-indicator"></span>REC</span>
                </div>
                <div class="camera-feed" id="camera-feed">
                    <div class="camera-scene" id="camera-scene">
                        <div class="scene-background lobby-bg" id="scene-bg"></div>
                        <div class="camera-scan"></div>
                        <div id="entity" class="entity" style="display: none;">👹</div>
                        <div id="status-text" class="status-text">
                            <div>SYSTEM ONLINE</div>
                            <div style="font-size: 12px; color: #444;">Monitoring facility...</div>
                        </div>
                    </div>
                </div>
                <div class="camera-controls" id="camera-controls">
                    <button class="camera-btn active" onclick="game.switchCamera(0)">CAM 1: LOBBY</button>
                    <button class="camera-btn" onclick="game.switchCamera(1)">CAM 2: HALLWAY</button>
                    <button class="camera-btn" onclick="game.switchCamera(2)">CAM 3: BASEMENT</button>
                    <button class="camera-btn" onclick="game.switchCamera(3)">CAM 4: EXTERIOR</button>
                </div>
            </div>

            <div class="sidebar">
                <div class="panel">
                    <div class="panel-title">Status</div>
                    
                    <div class="resource-bar">
                        <span class="resource-label">ENERGY</span>
                        <div class="bar">
                            <div id="energy-bar" class="bar-fill" style="width: 100%;"></div>
                        </div>
                        <span id="energy-val" class="resource-value">100</span>
                    </div>

                    <div class="resource-bar">
                        <span class="resource-label">HEALTH</span>
                        <div class="bar">
                            <div id="health-bar" class="bar-fill" style="width: 100%;"></div>
                        </div>
                        <span id="health-val" class="resource-value">100</span>
                    </div>

                    <div class="resource-bar">
                        <span class="resource-label">SANITY</span>
                        <div class="bar">
                            <div id="sanity-bar" class="bar-fill" style="width: 100%;"></div>
                        </div>
                        <span id="sanity-val" class="resource-value">100</span>
                    </div>

                    <div class="controls">
                        <button class="btn" onclick="game.toggleLights()">LIGHTS</button>
                        <button class="btn" onclick="game.toggleDoor()">DOOR</button>
                        <button class="btn" onclick="game.usePanic()">PANIC</button>
                    </div>
                </div>

                <div class="panel">
                    <div class="panel-title">Threats & Alerts</div>
                    <ul class="threat-list" id="threat-list">
                        <li class="threat-item">System initialized...</li>
                    </ul>
                    <div class="wave-counter">
                        Waves: <span id="wave-counter">0</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="game-over" id="game-over">
        <div class="game-over-text" id="game-over-title">GAME OVER</div>
        <div class="game-over-message" id="game-over-msg">You survived the night</div>
        <button class="restart-btn" onclick="location.reload()">RESTART</button>
    </div>

    <script>
        // Audio synthesis for creature sounds
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        function playCreatureSound() {
            const now = audioContext.currentTime;
            const duration = 1.5;

            // Main creepy frequency sweep
            const osc1 = audioContext.createOscillator();
            const gain1 = audioContext.createGain();
            osc1.connect(gain1);
            gain1.connect(audioContext.destination);

            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(150, now);
            osc1.frequency.exponentialRampToValueAtTime(80, now + duration);

            gain1.gain.setValueAtTime(0.3, now);
            gain1.gain.exponentialRampToValueAtTime(0.01, now + duration);

            // Distorted noise layer
            const bufferSize = audioContext.sampleRate * duration;
            const buffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            const source = audioContext.createBufferSource();
            source.buffer = buffer;
            
            const noiseGain = audioContext.createGain();
            source.connect(noiseGain);
            noiseGain.connect(audioContext.destination);
            
            noiseGain.gain.setValueAtTime(0.15, now);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, now + duration);

            // High-pitched screech
            const osc2 = audioContext.createOscillator();
            const gain2 = audioContext.createGain();
            osc2.connect(gain2);
            gain2.connect(audioContext.destination);

            osc2.type = 'sawtooth';
            osc2.frequency.setValueAtTime(400, now);
            osc2.frequency.exponentialRampToValueAtTime(250, now + 0.5);

            gain2.gain.setValueAtTime(0.05, now);
            gain2.gain.exponentialRampToValueAtTime(0, now + 0.5);

            osc1.start(now);
            osc1.stop(now + duration);
            source.start(now);
            source.stop(now + duration);
            osc2.start(now);
            osc2.stop(now + 0.5);
        }

        function playScreech() {
            const now = audioContext.currentTime;
            const duration = 0.8;

            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.connect(gain);
            gain.connect(audioContext.destination);

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.exponentialRampToValueAtTime(800, now + 0.2);
            osc.frequency.exponentialRampToValueAtTime(300, now + duration);

            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0, now + duration);

            osc.start(now);
            osc.stop(now + duration);
        }

        const game = {
            wave: 1,
            time: 300,
            energy: 100,
            health: 100,
            sanity: 100,
            lightsOn: true,
            doorLocked: true,
            isPanicMode: false,
            threatCount: 0,
            wavesSurvived: 0,
            currentCamera: 0,

            // Camera system
            cameras: [
                { name: 'LOBBY', description: 'Main entrance area', threatLevel: 0, activity: [], bgClass: 'lobby-bg' },
                { name: 'HALLWAY', description: 'East corridor', threatLevel: 0, activity: [], bgClass: 'hallway-bg' },
                { name: 'BASEMENT', description: 'Underground level', threatLevel: 0, activity: [], bgClass: 'basement-bg' },
                { name: 'EXTERIOR', description: 'Outside perimeter', threatLevel: 0, activity: [], bgClass: 'exterior-bg' }
            ],

            // Creature sounds
            sounds: [
                '🔊 GHRUUUUH...',
                '🔊 SCCREEEEECH...',
                '🔊 GRRAAAHHH...',
                '🔊 WROOOAARRGH...',
                '🔊 SCREEEEEK...'
            ],

            init() {
                this.updateUI();
                this.startWave();
                setInterval(() => this.gameLoop(), 1000);
            },

            gameLoop() {
                this.time--;
                this.energy -= this.lightsOn ? 2 : 1;
                this.sanity -= this.isPanicMode ? 3 : 1;

                if (this.energy < 0) this.energy = 0;
                if (this.sanity < 0) this.sanity = 0;

                if (this.energy <= 0) {
                    this.health -= 5;
                }

                if (this.health <= 0) {
                    this.gameOver('You were consumed by the darkness...');
                    return;
                }

                if (this.time <= 0) {
                    this.completeWave();
                    return;
                }

                this.updateUI();
                
                if (Math.random() < 0.02 * this.wave) {
                    this.threatAppears();
                }
            },

            startWave() {
                this.time = 300;
                this.threatCount = 0;
                this.cameras.forEach(cam => {
                    cam.threatLevel = 0;
                    cam.activity = [];
                });
                this.updateThreats();
            },

            threatAppears() {
                const cameraIndex = Math.floor(Math.random() * this.cameras.length);
                const camera = this.cameras[cameraIndex];
                
                this.threatCount++;
                camera.threatLevel++;
                camera.activity.push(`🚨 Threat detected at ${Date.now()}`);

                // If threat is in current camera, show it
                if (cameraIndex === this.currentCamera) {
                    const entity = document.getElementById('entity');
                    const statusText = document.getElementById('status-text');
                    const scene = document.getElementById('camera-scene');
                    
                    entity.style.display = 'block';
                    entity.style.left = Math.random() * 80 + '%';
                    entity.style.top = Math.random() * 80 + '%';
                    entity.classList.add('moving');
                    
                    scene.classList.add('glitch-effect');
                    
                    statusText.innerHTML = `<div style="color: #ff4444;">⚠️ THREAT DETECTED IN ${camera.name} ⚠️</div>`;

                    // Play creature sound
                    playCreatureSound();

                    // Display sound effect text
                    const soundText = document.createElement('div');
                    soundText.className = 'creature-sound';
                    soundText.textContent = this.sounds[Math.floor(Math.random() * this.sounds.length)];
                    soundText.style.left = entity.style.left;
                    soundText.style.top = entity.style.top;
                    scene.appendChild(soundText);
                    setTimeout(() => soundText.remove(), 2000);

                    this.sanity -= 10;
                    if (!this.doorLocked) this.health -= 15;

                    setTimeout(() => {
                        entity.style.display = 'none';
                        entity.classList.remove('moving');
                        scene.classList.remove('glitch-effect');
                        statusText.innerHTML = `<div>SYSTEM ONLINE</div><div style="font-size: 12px; color: #444;">Monitoring facility...</div>`;
                    }, 1500);
                } else {
                    // Alert about threat in other camera with quiet sound
                    playScreech();
                    this.sanity -= 5;
                }

                this.updateThreats();
            },

            switchCamera(index) {
                this.currentCamera = index;
                const camera = this.cameras[index];
                
                // Update scene background
                const bgElement = document.getElementById('scene-bg');
                bgElement.className = `scene-background ${camera.bgClass}`;
                
                // Update UI
                document.getElementById('camera-location').textContent = `📹 CAMERA ${index + 1}: ${camera.name}`;
                
                // Update button states
                const buttons = document.querySelectorAll('.camera-btn');
                buttons.forEach((btn, i) => {
                    btn.classList.toggle('active', i === index);
                });

                // Clear current view and show camera feed
                const statusText = document.getElementById('status-text');
                if (camera.activity.length > 0) {
                    statusText.innerHTML = `<div style="color: #ffff00;">⚠️ ACTIVITY IN ${camera.name}</div><div style="font-size: 12px; color: #ff9900;">Threat Level: ${camera.threatLevel}</div>`;
                } else {
                    statusText.innerHTML = `<div>CAMERA ${index + 1}: ${camera.name}</div><div style="font-size: 12px; color: #444;">${camera.description}</div>`;
                }

                document.getElementById('entity').style.display = 'none';
                this.energy -= 5; // Switching cameras costs energy
            },

            updateThreats() {
                const threatList = document.getElementById('threat-list');
                threatList.innerHTML = '';
                
                const threats = [
                    `[WAVE ${this.wave}] Total entities: ${this.threatCount}`,
                    `Current camera: ${this.cameras[this.currentCamera].name}`,
                    `Door status: ${this.doorLocked ? '🔒 LOCKED' : '🔓 UNLOCKED'}`,
                    `Lights: ${this.lightsOn ? '💡 ON' : '⚫ OFF'}`,
                    `---`,
                ];

                // Add per-camera threat levels
                this.cameras.forEach((cam, i) => {
                    if (cam.threatLevel > 0) {
                        threats.push(`⚠️ ${cam.name}: Level ${cam.threatLevel}`);
                    }
                });

                threats.forEach(threat => {
                    const li = document.createElement('li');
                    li.className = 'threat-item';
                    li.textContent = threat;
                    threatList.appendChild(li);
                });

                document.getElementById('wave-counter').textContent = this.wavesSurvived;
            },

            toggleLights() {
                this.lightsOn = !this.lightsOn;
                document.querySelector('.btn:nth-child(1)').classList.toggle('active', this.lightsOn);
                this.energy -= 20;
            },

            toggleDoor() {
                this.doorLocked = !this.doorLocked;
                document.querySelector('.btn:nth-child(2)').classList.toggle('active', !this.doorLocked);
                this.energy -= 10;
            },

            usePanic() {
                this.isPanicMode = !this.isPanicMode;
                document.querySelector('.btn:nth-child(3)').classList.toggle('active', this.isPanicMode);
                if (this.isPanicMode) {
                    this.health += 20;
                    if (this.health > 100) this.health = 100;
                    setTimeout(() => {
                        this.isPanicMode = false;
                        document.querySelector('.btn:nth-child(3)').classList.remove('active');
                    }, 5000);
                }
            },

            completeWave() {
                this.wavesSurvived++;
                this.wave++;
                this.energy = Math.min(100, this.energy + 30);
                this.health = Math.min(100, this.health + 20);
                this.sanity = Math.min(100, this.sanity + 40);
                this.startWave();
            },

            gameOver(reason) {
                document.getElementById('game-over').classList.add('show');
                document.getElementById('game-over-msg').textContent = `${reason} | Waves survived: ${this.wavesSurvived}`;
            },

            updateUI() {
                document.getElementById('timer').textContent = this.time;
                document.getElementById('wave').textContent = this.wave;

                const updateBar = (id, value, label) => {
                    const bar = document.getElementById(id);
                    bar.style.width = value + '%';
                    bar.classList.remove('warning', 'danger');
                    if (value < 30) bar.classList.add('danger');
                    else if (value < 60) bar.classList.add('warning');
                    document.getElementById(label).textContent = Math.round(value);
                };

                updateBar('energy-bar', this.energy, 'energy-val');
                updateBar('health-bar', this.health, 'health-val');
                updateBar('sanity-bar', this.sanity, 'sanity-val');
            }
        };

        game.init();
    </script>
</body>
</html>
